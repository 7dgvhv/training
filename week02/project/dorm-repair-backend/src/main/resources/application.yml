server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dorm_repair?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 123456   # 修改为你的数据库密码
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: your-256-bit-secret-key-which-is-long-enough
  expiration: 86400000   # 24小时，单位毫秒

upload:
  path: D:/uploads/
  url-prefix: /uploads/